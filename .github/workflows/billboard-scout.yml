name: billboard-scout

on:
  push:
    paths: ["packages/billboard-scout/**", ".github/workflows/billboard-scout.yml"]
  pull_request:
    paths: ["packages/billboard-scout/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/billboard-scout
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
