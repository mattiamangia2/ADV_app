[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "billboard-scout"
version = "0.1.0"
description = "Find outdoor advertising (billboards, posters, screens) in street-level imagery: location, facing, size, format and content."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "requests>=2.28",
  "pillow>=10",
]
keywords = ["billboard", "outdoor advertising", "OOH", "street view", "mapillary", "computer vision", "gis", "geojson"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.optional-dependencies]
# Zero-shot detector (Grounding DINO, Apache-2.0) — downloads model weights on first use.
detect = ["torch>=2.1", "transformers>=4.40"]
# Text reading on the billboard (needs the Tesseract program installed on the system).
ocr = ["pytesseract>=0.3.10"]
# DataFrames / GeoDataFrames for notebooks.
geo = ["pandas>=2", "geopandas>=0.14", "shapely>=2"]
dev = ["pytest>=8"]

[project.scripts]
billboard-scout = "billboard_scout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
